<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           width: 340px; padding: 14px; margin: 0; color: #222; }
    h1   { font-size: 14px; margin: 0 0 10px; }
    hr   { border: none; border-top: 1px solid #eee; margin: 10px 0; }

    .row { display: flex; align-items: center; gap: 8px; margin: 8px 0; font-size: 13px; }
    .col { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; }

    label       { font-size: 12px; color: #555; }
    small       { font-size: 11px; color: #999; }

    input[type=number] { width: 60px; padding: 3px 5px; border: 1px solid #ccc; border-radius: 3px; }
    input[type=url],
    input[type=text]   { width: 100%; padding: 4px 6px; font-size: 12px;
                         border: 1px solid #ccc; border-radius: 3px; }
    input.invalid      { border-color: #d44; }

    .hint       { font-size: 11px; color: #999; min-height: 14px; }
    .hint.error { color: #c44; }

    .save-row   { display: flex; justify-content: flex-end; height: 16px; margin-top: 2px; }
    .saved      { font-size: 11px; color: #2a9; opacity: 0; transition: opacity 0.25s; }
    .saved.show { opacity: 1; }

    button { width: 100%; padding: 8px 10px; margin-top: 6px;
             background: #cc785c; color: #fff; border: 0; border-radius: 5px;
             cursor: pointer; font-size: 13px; }
    button:hover     { background: #b46a52; }
    button:disabled  { background: #bbb; cursor: default; }

    .status     { font-size: 11px; color: #555; margin-top: 10px; line-height: 1.5;
                  white-space: pre-wrap; border-top: 1px solid #eee; padding-top: 8px; }
    .status .err{ color: #c44; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Claude Usage Watcher</h1>

  <div class="row">
    <input type="checkbox" id="enabled" />
    <label for="enabled" style="font-size:13px;color:#222">Enable monitoring</label>
  </div>

  <div class="row">
    <label for="interval" style="font-size:13px;color:#222">Check every</label>
    <input type="number" id="interval" min="1" max="120" value="5" />
    <span style="font-size:13px">min</span>
  </div>

  <hr />

  <div class="col">
    <label for="newChatUrl">
      Session URL <small>(blank = use claude.ai/new)</small>
    </label>
    <input type="url" id="newChatUrl" placeholder="https://claude.ai/new" />
    <span class="hint" id="urlHint"></span>
  </div>

  <div class="col">
    <label for="chatMessage">
      Message to send <small>(blank = "hello")</small>
    </label>
    <input type="text" id="chatMessage" placeholder="hello" maxlength="500" />
  </div>

  <div class="save-row">
    <span class="saved" id="savedLabel">Saved ✓</span>
  </div>

  <button id="runNow">Run check now</button>

  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
